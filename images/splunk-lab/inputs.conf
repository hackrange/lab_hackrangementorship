# Operation Quiet Vendor telemetry, ingested at build time. Each source gets a
# distinct sourcetype so the student can search by source.
[monitor:///opt/quietvendor/data/windows_security.log]
sourcetype = winsec
index = main
[monitor:///opt/quietvendor/data/sysmon.log]
sourcetype = sysmon
index = main
[monitor:///opt/quietvendor/data/vpn.log]
sourcetype = vpn
index = main
[monitor:///opt/quietvendor/data/dns.log]
sourcetype = dns
index = main
[monitor:///opt/quietvendor/data/proxy.log]
sourcetype = proxy
index = main
[monitor:///opt/quietvendor/data/firewall.log]
sourcetype = firewall
index = main
[monitor:///opt/quietvendor/data/linux_auth.log]
sourcetype = linux_auth
index = main
[monitor:///opt/quietvendor/data/webserver.log]
sourcetype = webaccess
index = main
[monitor:///opt/quietvendor/data/mail_gateway.log]
sourcetype = mailgw
index = main
