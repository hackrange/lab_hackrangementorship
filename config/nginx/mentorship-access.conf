# The web desktop and the control panel, at https://<this machine>:8456.
#
# Guacamole behind TLS.  The certificate is issued by this machine's own lab CA
# for every address the machine has (hackrange-access cert keeps it current),
# so once a student trusts that CA there is no warning at all.
#
# Whether the browser opens a desktop or a terminal is decided by the running
# lab, not here: hackrange-access writes the connection from the catalog each
# time a lab starts, because four of this course's seven labs are terminals.
#
# Author: Tim Rice - tim.j.rice@hackrange.com
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($mentorship_host_ok = 0) { return 421; }   # no DNS rebinding (mentorship-hostcheck.conf)
    listen 8456 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/mentorship-tls/lab-access.crt;
    ssl_certificate_key /etc/nginx/mentorship-tls/lab-access.key;

    include /etc/nginx/mentorship-private-only.conf;

    # The root is the control panel, which is where a student should land: it
    # shows their login, what the machine is doing, and a button for each lab.
    # Before there was a panel this went straight to Guacamole, which asked a
    # beginner for a password with no way to find out what it was, and offered
    # no way to start a lab for it to show.
    location = / { return 302 /control/; }

    # The control panel.  It asks for the lab login, because this door is open
    # to the whole private network.  nginx sets X-HR-Door itself, overwriting
    # whatever a browser sent, so a request cannot claim to be trusted.
    location = /control { return 302 /control/; }
    location /control/ {
        proxy_pass http://unix:/run/hackrange-mentorship/control.sock:/;
        proxy_set_header X-HR-Door remote;
        proxy_set_header X-Real-IP $remote_addr;
        # Starting a lab can take a couple of minutes on a slow machine, and
        # the panel answers before the work is done; this is only the margin.
        proxy_read_timeout 300s;
    }

    # HackRange's icon in the browser tab.  Guacamole names its icon in its own
    # page, which an extension cannot change, so the two addresses it uses are
    # answered here with HackRange's instead.
    location = /guacamole/images/logo-64.png {
        alias /etc/nginx/mentorship-brand/favicon-64.png;
        default_type image/png;
    }
    location = /guacamole/images/logo-144.png {
        alias /etc/nginx/mentorship-brand/favicon-144.png;
        default_type image/png;
    }

    # The lab CA's public certificate, so a student can tell their own computer
    # to trust this lab (see the README).  Public by nature: no secret in it.
    location = /lab-ca.crt {
        alias /etc/nginx/mentorship-tls/lab-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location /guacamole/ {
        proxy_pass http://127.0.0.1:18091/guacamole/;
        # Buffering off, or a slow connection stalls the session at about 30KB.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mentorship_connection_upgrade;
        proxy_cookie_path /guacamole/ /guacamole/;
        # A lab session is one long WebSocket.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        access_log off;
    }
}
