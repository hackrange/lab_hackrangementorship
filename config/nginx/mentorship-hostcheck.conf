# Which Host names the lab's web servers answer to (http level, used by every
# hackrange server block).  An IP address, a .lab or .local name, localhost, or
# a one word machine name.  What is left out is any real domain: that is what
# a DNS rebinding attack needs (a page on attacker.example that suddenly
# resolves to this machine), so a request naming one is refused with 421.
#
# Author: Tim Rice - tim.j.rice@hackrange.com
map $host $mentorship_host_ok {
    default                0;
    ~^[0-9.]+$             1;
    ~^\[?[0-9a-f:]+\]?$    1;
    ~\.lab$                1;
    ~\.local$              1;
    localhost              1;
    ~^[a-z0-9-]+$          1;
}

# What to send upstream as "Connection" when proxying a WebSocket.  A lab
# session is one long WebSocket, and the correct value depends on the request:
# "upgrade" for one that is upgrading, "close" otherwise.  Passing the
# browser's own Connection header through instead happens to work for the
# browsers that send exactly "Upgrade", and fails for one that sends
# "keep-alive, Upgrade", which is equally legal.
map $http_upgrade $mentorship_connection_upgrade {
    default upgrade;
    ''      close;
}
