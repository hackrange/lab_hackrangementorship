# TCP passthroughs, at the top level of nginx's configuration.
#
# SSH (2223) and Remote Desktop (13489) into whichever lab is running.  The lab
# itself listens on loopback only (12223 and 13490); nginx is the door, so the
# private-networks-only rule applies to them as it does to the web desktop.
#
# These numbers are deliberately not the DevSecOps Local Lab's (2222/13389 at
# the door, 12222/13390 behind it): a student may have both courses installed,
# and nginx will not start if two blocks want the same port.
#
# Author: Tim Rice
stream {
    server {
        listen 2223;
        include /etc/nginx/mentorship-private-only.conf;
        proxy_pass 127.0.0.1:12223;
        proxy_timeout 7d;
    }

    server {
        listen 13489;
        include /etc/nginx/mentorship-private-only.conf;
        proxy_pass 127.0.0.1:13490;
        proxy_timeout 7d;
    }
}
