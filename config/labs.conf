# The labs of the Hackrange Mentorship course, and how to run each one.
#
# One row per lab, in the order a student meets them.  Everything that differs
# between labs lives here and nowhere else, so adding a lab is one line and the
# launcher, the status display and the tests all pick it up.
#
#   key        the name a student types:  hackrange-lab start netlab
#   image      the container image built by scripts/50-images.sh
#   proto      rdp (a desktop) or ssh (a terminal), matching the hosted lab
#   caps       default | offsec (adds NET_RAW) | netlab (adds NET_RAW+NET_ADMIN)
#   companion  a second container on a private network beside this one, or '-'
#   weeks      the course weeks this lab belongs to, for the listing
#   title      what the student sees
#   web        web apps INSIDE the lab that the student may open from their own
#              browser, as port/Label, comma separated, or '-' for none
#
# caps are the hosted profiles, kept identical here so a lesson behaves the
# same.  offsec is for nmap's raw-socket scans; netlab is for the lessons where
# the student reconfigures routing and the firewall, which needs NET_ADMIN.  A
# container only ever changes its OWN network namespace, so this cannot reach
# the student's machine.
#
# The web column is deliberately almost empty.  Publishing a port puts that
# service on the student's home network, so only a service that is meant to be
# signed into gets one.  The Week 11 portal does NOT, on purpose: it is a
# deliberately vulnerable application with command injection in it, and
# publishing it would hand anyone on the network a shell in the lab.  It stays
# reachable from inside the lab, where the lesson uses it.
#
# Splunk gets one because it earns its keep twice.  It is a login page rather
# than a vulnerability, and it gives an ARM student a second way in: Splunk has
# no ARM build, so that lab runs emulated.  Opened from the student's own
# browser, only Splunk itself is emulated and all the drawing happens natively
# on their machine.  The lab's own desktop works as well; this is a choice, not
# a rescue.
#
# Every lab has internet on this machine.  The hosted labs cut egress because
# they are shared and must assume a hostile tenant; a Local Lab is one person
# on their own VM, so there is nothing to isolate them from.
#
# Author: Tim Rice - tim.j.rice@hackrange.com
#
# key|image|proto|caps|companion|weeks|title|web
kali|kali-lab-ssh:latest|ssh|offsec|-|1|Networking foundations: addresses, subnets, IPv6, reading a machine|-
netlab|netlab:latest|ssh|netlab|-|2-4|DNS, routing, the firewall, server hardening and the CIS Controls|-
analyst|analyst-lab:latest|rdp|default|-|5-7|Audit evidence, and hunting shadow SaaS and shadow AI|-
splunk|splunk-lab:latest|rdp|default|-|8-10|Splunk: first searches, Operation Quiet Vendor, detection engineering|8000/Splunk
webapp|webapp-lab:latest|ssh|default|-|11|Source-driven web app review with AI|-
webapp-gui|mentorship-webapp-gui:latest|rdp|default|nextgen-dast-lab:latest|11|The AI-assisted security review: desktop, Burp, and a DAST scanner|-
cloud|cloud-audit-lab:latest|ssh|default|-|12|Auditing a misconfigured cloud account|-
