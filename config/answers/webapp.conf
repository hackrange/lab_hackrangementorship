# Week 11, the source-driven review of the Internal Tools Portal.
#
# The portal hides a marker behind three vulnerabilities, reachable only by
# exploiting them properly, so finding one is proof the student got real impact
# rather than an error message.  The portal has more vulnerability classes than
# this; these are the three that can be checked mechanically.
#
# Author: Tim Rice
#
# marker|what it is
FLAG-sql-injection-reached-the-secrets-table|An injection that reached a table the query was never meant to touch
FLAG-idor-read-another-customers-invoice|Reading another customer's record by changing an identifier
FLAG-path-traversal-escaped-the-reports-folder|A file path that escaped the folder it was supposed to stay in
