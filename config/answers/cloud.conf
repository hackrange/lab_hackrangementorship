# Week 12, Challenge: Audit a Cloud Account.
#
# Each line is one real misconfiguration the account export contains, as the
# marker it carries and the plain description a student would write.  The
# checker never prints the markers a student has not found; it names what is
# still missing in these words instead, so the check tells them where to look
# without handing over the answer.
#
# Author: Tim Rice
#
# marker|what it is
FLAG-s3-public-bucket-world-readable|A storage bucket readable by the whole world
FLAG-iam-wildcard-admin-star-star|An identity policy granting every action on every resource
FLAG-security-group-ssh-open-to-world|A firewall rule opening remote login to the internet
FLAG-cloudtrail-logging-disabled|The audit log of the account turned off
FLAG-imdsv1-metadata-exposed|The old instance metadata service, the one reachable by a server side request forgery
FLAG-hardcoded-secret-in-user-data|A secret written into a machine's start up script
FLAG-plaintext-admin-access-keys-committed|Administrator access keys committed in the clear
