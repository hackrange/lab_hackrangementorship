# The logins that belong to the software INSIDE a lab, as opposed to the one
# login that gets you into the lab itself.
#
# One file, because two things need these: "hackrange-lab env" in a terminal
# and the card for that lab in the control panel.  Keeping a copy in each is
# how a password gets changed in one of them and not the other, and a student
# is then told something untrue by whichever one they happened to open.
#
#   key     the lab, as config/labs.conf names it
#   group   the heading these rows sit under
#   label   what the value is
#   value   the value itself
#   secret  1 to hide it until the student asks, 0 to show it
#   note    an aside, or '-'
#
# These are not secrets in any real sense: they are baked into the lab images
# and are the same for every student, which is why they can live here.  The
# lab's OWN password, the one that changes every time a lab starts, is kept
# where only an administrator can read it and never appears in this
# repository.
#
# Author: Tim Rice - tim.j.rice@hackrange.com
#
# key|group|label|value|secret|note
splunk|Splunk, inside the lab|address|http://localhost:8000|0|or port 8000 on this machine, from your own browser
splunk|Splunk, inside the lab|username|admin|0|-
splunk|Splunk, inside the lab|password|Changeme123|1|-
webapp-gui|The target and the scanner|portal|http://portal.lab:5000|0|its source is in ~/app
webapp-gui|The target and the scanner|scanner|http://dast:8888|0|the DAST icon on the desktop
webapp-gui|The target and the scanner|username|admin|0|-
webapp-gui|The target and the scanner|password|student|1|-
webapp-gui|The target and the scanner|scan this|http://target:5000|0|the portal, as the scanner sees it
